services:
  app1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./app1:/var/www/html
    ports:
      - "8001:8000"
    environment:
      APP_URL: http://localhost:8001
      DB_DATABASE: database/app1.sqlite
    command:
      - sh
      - -lc
      - |
        composer install --no-interaction
        exec php artisan serve --host=0.0.0.0 --port=8000

  app2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./app2:/var/www/html
    ports:
      - "8002:8000"
    environment:
      APP_URL: http://localhost:8002
      DB_DATABASE: database/app2.sqlite
    command:
      - sh
      - -lc
      - |
        composer install --no-interaction
        exec php artisan serve --host=0.0.0.0 --port=8000
